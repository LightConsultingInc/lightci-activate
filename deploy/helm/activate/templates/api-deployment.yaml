apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "activate.fullname" . }}-api
  labels:
    {{- include "activate.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "activate.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "activate.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/values: {{ toJson .Values | sha256sum | trunc 16 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "activate.serverImage" . }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          env:
            - name: ACTIVATE_ROLE
              value: api
            {{- include "activate.serverEnv" . | nindent 12 }}
          {{- include "activate.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "activate.serverVolumeMounts" . | nindent 12 }}
            - name: data
              mountPath: /data
      volumes:
        {{- include "activate.serverVolumes" . | nindent 8 }}
        # The api role keeps only transient clones here; the worker owns the durable volume.
        - name: data
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "activate.fullname" . }}-api
  labels:
    {{- include "activate.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "activate.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "activate.fullname" . }}-api
  labels:
    {{- include "activate.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "activate.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "activate.fullname" . }}-api
  labels:
    {{- include "activate.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "activate.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
