name: CI

# Every pull request runs the whole test plan in docs/self-hosting-plan.md that can run without
# cloud accounts; jobs that need LightCI's WorkOS test environment skip on forks (no secrets).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_HOST: localhost
  DB_PORT: "5432"
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_DATABASE: lightci_activate

jobs:
  api:
    name: API unit tests, types and migration policy
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: yarn, cache-dependency-path: api/yarn.lock }
      - run: yarn install --frozen-lockfile
      - run: yarn tsc --noEmit -p tsconfig.json
      - name: Lint without autofix (the local `yarn lint` fixes formatting; CI must fail on it)
        run: yarn eslint "{src,apps,libs,test}/**/*.ts"
      - run: yarn test --ci
      - name: Migrations are additive within a major (T7.2)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: node scripts/check-migrations.mjs --base "origin/${{ github.base_ref }}" ${{ contains(github.event.pull_request.labels.*.name, 'major-release') && '--allow-destructive' || '' }}

  api-integration:
    name: API integration (Postgres, Keycloak, git remote, jobs, licence)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: lightci_activate }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: yarn, cache-dependency-path: api/yarn.lock }
      - run: yarn install --frozen-lockfile
      - name: Keycloak with the activate-test realm
        run: ./test/keycloak/start.sh
      - name: Integration suite (T1, T2, T3 rows marked integration)
        env:
          LIBRARY_REPO_PATH: ${{ github.workspace }}/marketplace
          # Live WorkOS provisioning test (T1.1, T1.2); skipped when absent.
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
        run: yarn test:int --ci
      - name: Keycloak logs on failure
        if: failure()
        run: docker logs activate-keycloak 2>&1 | tail -100

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: yarn, cache-dependency-path: frontend/yarn.lock }
      - run: yarn install --frozen-lockfile
      - run: yarn tsc --noEmit
      - run: yarn lint

  mcp-app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mcp-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: yarn install --frozen-lockfile || yarn install
      - run: yarn build

  e2e-oidc:
    # The whole suite against Keycloak behind Activate's OAuth server (T1.10), on every PR.
    name: E2E (oidc)
    runs-on: ubuntu-latest
    needs: [api, frontend, mcp-app]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: lightci_activate }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-stack
        with: { auth: oidc }

  e2e-workos:
    # The same suite in WorkOS mode (T1.6). Signs in to LightCI's WorkOS test environment, so it needs
    # secrets and does not run for pull requests from forks.
    name: E2E (workos)
    runs-on: ubuntu-latest
    needs: [api, frontend, mcp-app]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: lightci_activate }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-stack
        with:
          auth: workos
          workos-api-key: ${{ secrets.WORKOS_API_KEY }}
          workos-client-id: ${{ secrets.WORKOS_CLIENT_ID }}

  helm:
    name: Helm chart lint, unit tests and both modes render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false
      - run: helm lint deploy/helm/activate
      - run: helm unittest deploy/helm/activate
      - name: The guide's minimum values render, in both identity modes
        run: |
          helm template activate deploy/helm/activate > /dev/null
          helm template activate deploy/helm/activate --set auth.provider=workos --set auth.workos.existingSecret=activate-workos --set edition=cloud > /dev/null

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive infra deploy/terraform
      - name: Validate every root and module without credentials
        run: |
          set -e
          for d in deploy/terraform/aws infra/aws/modules/* infra/aws/envs/*; do
            echo "== $d"; (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate -no-color)
          done

  compose:
    # The Compose evaluation install (T4.5) with the images built from this commit: migrate gates api and
    # worker, Keycloak over a private CA, doctor, metrics, web, data survives down/up. Needs the licence
    # signing key, so it does not run for pull requests from forks.
    name: Compose install
    runs-on: ubuntu-latest
    needs: [api, frontend, mcp-app]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: yarn, cache-dependency-path: api/yarn.lock }
      - run: yarn --cwd api install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Build the release images for this commit
        run: |
          docker build -f api/Dockerfile -t ghcr.io/lightci/activate/server:smoke .
          docker build -t ghcr.io/lightci/activate/web:smoke frontend
      - run: ACTIVATE_VERSION=smoke scripts/ci/compose-smoke.sh
        env:
          LICENSE_SIGNING_KEY: ${{ secrets.LICENSE_SIGNING_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  kind:
    # A real install (T4.4, T7.4, T7.5): build both images, load them into kind, install the chart against
    # TLS Postgres and Keycloak over a private CA with a real licence, then doctor, metrics, web, upgrade,
    # rollback. Needs the licence signing key, so it does not run for pull requests from forks.
    name: Helm install on kind
    runs-on: ubuntu-latest
    needs: [helm]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1.12.0
        with: { cluster_name: activate }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: yarn, cache-dependency-path: api/yarn.lock }
      - run: yarn --cwd api install --frozen-lockfile
      - run: scripts/ci/kind-smoke.sh
        env:
          LICENSE_SIGNING_KEY: ${{ secrets.LICENSE_SIGNING_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n activate describe pods | tail -200
          kubectl -n activate logs -l app.kubernetes.io/component=api --tail=200 || true
          kubectl -n activate logs -l app.kubernetes.io/component=migrate --tail=200 || true
          kubectl -n activate logs -l app.kubernetes.io/component=bootstrap --tail=200 || true
          kubectl -n activate logs deploy/keycloak --tail=100 || true
