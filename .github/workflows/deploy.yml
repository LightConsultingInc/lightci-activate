name: Deploy cells

# A human promotes a release through LightCI's cells: us-prod, then eu-prod. Each cell is a GitHub
# environment; required reviewers need GitHub Enterprise on a private repository, so the gate here is
# that this workflow only runs by hand. Per cell: verify and mirror the signed images into the cell's
# ECR, terraform apply with the new image tag, run the one-shot migrate task and wait for exit 0, roll
# the services and check /api/ready before the next cell starts. A staging cell, not a timed bake, is
# meant to be the gate before production.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release to deploy (without the v)
        required: true
      cells:
        description: Comma-separated cells to deploy (us,eu)
        default: us,eu

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      cells: ${{ steps.v.outputs.cells }}
    steps:
      - id: v
        run: |
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"; echo "cells=${{ inputs.cells }}" >> "$GITHUB_OUTPUT"
      - name: The release must exist (signed images, chart, notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "v${{ steps.v.outputs.version }}" --repo ${{ github.repository }} > /dev/null

  us-prod:
    needs: version
    if: contains(needs.version.outputs.cells, 'us')
    uses: ./.github/workflows/deploy-cell.yml
    with:
      cell: us
      region: us-east-1
      root: infra/aws/envs/us-prod
      version: ${{ needs.version.outputs.version }}
      api_url: https://api.activate.lciventure.com
    secrets:
      role_arn: ${{ secrets.AWS_DEPLOY_ROLE_US }}

  eu-prod:
    needs: [version, us-prod]
    # A job that needs a skipped job is skipped too unless the condition opts in with !cancelled(),
    # so an EU-only run (cells=eu) would otherwise never start.
    if: "!cancelled() && contains(needs.version.outputs.cells, 'eu') && (needs.us-prod.result == 'success' || needs.us-prod.result == 'skipped')"
    uses: ./.github/workflows/deploy-cell.yml
    with:
      cell: eu
      region: eu-central-1
      root: infra/aws/envs/eu-prod
      version: ${{ needs.version.outputs.version }}
      api_url: https://api.eu.activate.lciventure.com
    secrets:
      role_arn: ${{ secrets.AWS_DEPLOY_ROLE_EU }}
