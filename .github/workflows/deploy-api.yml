name: Deploy (AWS dev)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "frontend/**"
      - "mcp-app/**"
      - "marketplace/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: lightci-activate-dev-cluster
  API_ECR_REPOSITORY: lightci-activate-dev
  API_ECS_SERVICE: lightci-activate-dev
  WEB_ECR_REPOSITORY: lightci-activate-dev-web
  WEB_ECS_SERVICE: lightci-activate-dev-web
  WEB_ECS_CLUSTER: lightci-activate-dev-web-cluster
  API_URL: https://lightci-activate-api.lciventure.com
  WEB_URL: https://lightci-activate.lciventure.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # API image carries the MCP app bundle (root build context). Dev is a demo cell, so it also
      # carries the demo marketplace; release builds leave DEMO_MARKETPLACE at its default of 0.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            DEMO_MARKETPLACE=1
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.API_ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.API_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_WORKOS_REDIRECT_URI=${{ env.WEB_URL }}/callback
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.WEB_ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.WEB_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Terraform ignores task_definition drift on the service, so point each service at the
      # latest revision of its family (new env/secrets land) and force a fresh deployment.
      - name: Roll ECS services
        run: |
          API_TD=$(aws ecs describe-task-definition --task-definition "$API_ECS_SERVICE" --query taskDefinition.taskDefinitionArn --output text)
          WEB_TD=$(aws ecs describe-task-definition --task-definition "$WEB_ECS_SERVICE" --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$API_ECS_SERVICE" --task-definition "$API_TD" --force-new-deployment > /dev/null
          aws ecs update-service --cluster "$WEB_ECS_CLUSTER" --service "$WEB_ECS_SERVICE" --task-definition "$WEB_TD" --force-new-deployment > /dev/null
          echo "Rollouts triggered; waiting for services to stabilise..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$API_ECS_SERVICE"
          aws ecs wait services-stable --cluster "$WEB_ECS_CLUSTER" --services "$WEB_ECS_SERVICE"
          echo "Both services stable."
